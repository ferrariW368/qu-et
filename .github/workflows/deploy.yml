# qu/et: dist/ klasörü değişince Cloudflare Pages'e (qu-et) yükler.
# Gerekli GitHub secret'ları: CLOUDFLARE_API_TOKEN (yalnızca "Cloudflare Pages: Edit"), CLOUDFLARE_ACCOUNT_ID
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['dist/**', 'functions/**', 'wrangler.toml']
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=qu-et --branch=main
