# qu/et: dist/ değişince Cloudflare Pages'e (qu-et) yükler.
# Gerekli GitHub secret'ları: CLOUDFLARE_API_TOKEN (yalnızca "Cloudflare Pages: Edit"), CLOUDFLARE_ACCOUNT_ID
# Hata nedenleri "Annotations" bölümüne yazılır (giriş gerektirmeden okunur).
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['dist/**', 'functions/**', 'wrangler.toml', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Secret kontrolu
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error title=Secret::CLOUDFLARE_API_TOKEN bos veya yok (ad birebir bu olmali)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error title=Secret::CLOUDFLARE_ACCOUNT_ID bos veya yok (ad birebir bu olmali)"; exit 1; }
          echo "ACCOUNT_ID uzunlugu: ${#CLOUDFLARE_ACCOUNT_ID} (32 olmali)"
          echo "TOKEN uzunlugu: ${#CLOUDFLARE_API_TOKEN}"
      - name: Token dogrulama
        run: |
          out=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify || true)
          echo "$out" | head -c 400
          echo "$out" | grep -q '"success":true' || echo "::warning title=Token::user token dogrulanamadi (hesap tokeni olabilir): $(echo "$out" | head -c 200)"
      - name: Deploy
        run: |
          set +e
          npx --yes wrangler@4 pages deploy dist --project-name=qu-et --branch=main 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            msg=$(grep -iE "error|✘|authentication|invalid|not found|permission|code:" deploy.log | head -6 | tr '\n' ' ' | head -c 900)
            echo "::error title=Deploy hatasi::$msg"
            exit $code
          fi
